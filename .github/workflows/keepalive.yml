# Mantém o projeto do Supabase ativo: o plano grátis pausa depois de ~7 dias sem uso.
# A cada 3 dias acorda a API no Render (cold start ~50s) e chama uma rota pública
# que lê o banco (GET /api/indicators → tabela economic_indicators).
name: Manter banco ativo

on:
  schedule:
    - cron: '0 12 */3 * *' # 09:00 em Brasília, a cada 3 dias
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Acordar a API e consultar o banco
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 https://financas-api-sv3f.onrender.com/api/indicators || true)
            if [ "$code" = "200" ]; then echo "ok ($code)"; exit 0; fi
            echo "tentativa $i: HTTP $code"
            sleep 30
          done
          exit 1
